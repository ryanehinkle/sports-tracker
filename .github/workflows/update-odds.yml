name: Update NFL Odds

on:
  workflow_dispatch:
    inputs:
      lookahead_hours:
        description: "How many hours ahead to refresh"
        required: false
        default: "168"
  push:
    branches: ["main"]
    paths:
      - "scripts/update_odds.py"
      - "scripts/validate_prop_tracking.py"
      - ".github/workflows/update-odds.yml"
      - "requirements.txt"
  schedule:
    # Refresh near-term FanDuel prices every 15 minutes so displayed parlays
    # are built from current leg prices rather than multi-hour-old snapshots.
    - cron: "2,17,32,47 * * * *"
    # Broader weekly refresh so newly posted future props also get picked up.
    - cron: "41 15 * * 3,5"

permissions:
  contents: write

concurrency:
  group: nfl-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine refresh window
        id: window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "hours=${{ inputs.lookahead_hours }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "41 15 * * 3,5" ]; then
            echo "hours=168" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "hours=168" >> "$GITHUB_OUTPUT"
          else
            echo "hours=36" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate prop tracking mappings
        run: python scripts/validate_prop_tracking.py

      - name: Pull FanDuel NFL player props
        env:
          ODDS_LOOKAHEAD_HOURS: ${{ steps.window.outputs.hours }}
        run: python scripts/update_odds.py

      - name: Commit refreshed odds
        shell: bash
        run: |
          if git diff --quiet -- data/nfl-odds.json; then
            echo "No odds changes."
            exit 0
          fi

          cp data/nfl-odds.json /tmp/nfl-odds.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/nfl-odds.json data/nfl-odds.json

          if git diff --quiet -- data/nfl-odds.json; then
            echo "Remote already has these odds."
            exit 0
          fi

          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nfl-odds.json
          git commit -m "Update FanDuel NFL player props"
          git push
