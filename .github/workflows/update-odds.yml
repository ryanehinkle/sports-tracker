name: Update NFL Odds

on:
  workflow_dispatch:
    inputs:
      lookahead_hours:
        description: "How many hours ahead to refresh"
        required: false
        default: "168"
  push:
    branches: ["main"]
    paths:
      - "scripts/update_odds.py"
      - "scripts/validate_prop_tracking.py"
      - "scripts/build_ladder.py"
      - "scripts/archive_model.py"
      - "scripts/update_team_stats.py"
      - ".github/workflows/update-odds.yml"
      - "requirements.txt"
  schedule:
    # Frequent refreshes let us freeze a board close to one hour before each kickoff window.
    - cron: "12,42 * * * *"
    # Broader weekly refresh so newly posted future markets also get picked up.
    - cron: "41 15 * * 3,5"

permissions:
  contents: write

concurrency:
  group: nfl-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine refresh window
        id: window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "hours=${{ inputs.lookahead_hours }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "41 15 * * 3,5" ]; then
            echo "hours=168" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "hours=168" >> "$GITHUB_OUTPUT"
          else
            echo "hours=36" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate prop tracking mappings
        run: python scripts/validate_prop_tracking.py

      - name: Pull FanDuel NFL player + team/game markets
        env:
          ODDS_LOOKAHEAD_HOURS: ${{ steps.window.outputs.hours }}
        run: python scripts/update_odds.py

      - name: Build or grade daily ladder pick
        run: python scripts/build_ladder.py

      - name: Commit refreshed odds and history
        shell: bash
        run: |
          if git diff --quiet -- data/nfl-odds.json data/odds-history data/ladder-picks.json; then
            echo "No odds/history changes."
            exit 0
          fi

          cp data/nfl-odds.json /tmp/nfl-odds.json
          [ -f data/ladder-picks.json ] && cp data/ladder-picks.json /tmp/ladder-picks.json || true
          [ -d data/odds-history ] && cp -R data/odds-history /tmp/odds-history || true

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/nfl-odds.json data/nfl-odds.json
          [ -f /tmp/ladder-picks.json ] && cp /tmp/ladder-picks.json data/ladder-picks.json || true
          if [ -d /tmp/odds-history ]; then
            rm -rf data/odds-history
            cp -R /tmp/odds-history data/odds-history
          fi

          if git diff --quiet -- data/nfl-odds.json data/odds-history data/ladder-picks.json; then
            echo "Remote already has these generated updates."
            exit 0
          fi

          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nfl-odds.json data/odds-history data/ladder-picks.json
          git commit -m "Update FanDuel NFL markets and history"
          git push

      - name: Freeze full Model state before kickoff
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          python scripts/archive_model.py --source-commit "$SOURCE_COMMIT"

          if git diff --quiet -- data/model-history; then
            echo "No Model archive due."
            exit 0
          fi

          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/model-history
          git commit -m "Archive pregame Model state"
          git push
