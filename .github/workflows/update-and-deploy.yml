name: Update NFL Stats & Deploy

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. Run hourly; the updater is cheap and this
    # keeps the page current within about an hour of ESPN posting final stats.
    - cron: "17 * * * *"
  push:
    branches: ["main"]
    paths-ignore:
      - "data/nfl-stats.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nfl-stats-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull current ESPN stats
        run: python scripts/update_stats.py

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/nfl-stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed stats
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nfl-stats.json
          git commit -m "Update NFL player stats"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
