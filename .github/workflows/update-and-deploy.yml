name: Update NFL Stats

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Check every hour for fresh ESPN season totals.
    - cron: "17 * * * *"
  push:
    branches: ["main"]
    paths-ignore:
      - "data/nfl-stats.json"
      - "data/nfl-team-stats.json"
      - "data/nfl-odds.json"

permissions:
  contents: write

concurrency:
  group: nfl-stats-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull current ESPN player stats
        run: python scripts/update_stats.py

      - name: Pull current ESPN team stats
        run: python scripts/update_team_stats.py

      - name: Commit refreshed stats
        shell: bash
        run: |
          if git diff --quiet -- data/nfl-stats.json data/nfl-team-stats.json; then
            echo "No player/team stat changes."
            exit 0
          fi
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nfl-stats.json data/nfl-team-stats.json
          git commit -m "Update NFL player and team stats"
          git pull --rebase origin main
          git push
