name: Update NFL Stats

on:
  workflow_dispatch:
  schedule:
    # Hourly fallback all week.
    - cron: "17 * * * *"
    # Fast postgame grading windows. These run every 15 minutes around the
    # normal NFL completion windows so finished slates do not sit pending.
    - cron: "*/15 19-23 * * 0"
    - cron: "*/15 0-6 * * 1"
    - cron: "*/15 2-6 * * 2,5"
  push:
    branches: ["main"]
    paths:
      - "scripts/update_stats.py"
      - "scripts/update_hit_timing.py"
      - "scripts/update_team_stats.py"
      - "scripts/update_odds.py"
      - "scripts/build_model_calibration.py"
      - "scripts/learn_model.py"
      - "scripts/validate_prop_tracking.py"
      - "scripts/build_ladder.py"
      - "requirements.txt"
      - ".github/workflows/update-and-deploy.yml"
      - ".github/force-stats-run"

permissions:
  contents: write

# Keep the stats/grading pipeline independent from the high-frequency odds
# workflow. Odds refreshes must never cancel a postgame grading run.
concurrency:
  group: nfl-stats-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull current ESPN player stats
        run: python scripts/update_stats.py

      - name: Pull current + prior ESPN team stats
        run: python scripts/update_team_stats.py

      - name: Build ESPN prop hit timing
        run: python scripts/update_hit_timing.py

      - name: Validate generated model code
        run: |
          python -m py_compile scripts/update_stats.py scripts/update_hit_timing.py scripts/update_odds.py scripts/build_ladder.py scripts/build_model_calibration.py scripts/learn_model.py scripts/archive_model.py scripts/validate_prop_tracking.py
          node --check app.js
          node --check model.js

      - name: Validate prop tracking mappings
        run: python scripts/validate_prop_tracking.py

      - name: Rebuild 2025 model calibration
        run: python scripts/build_model_calibration.py

      - name: Precompute prop hit rates and grade archived boards
        run: python scripts/update_odds.py --history-only

      - name: Learn from every newly graded leg
        run: python scripts/learn_model.py

      - name: Grade daily ladder challenge
        run: python scripts/build_ladder.py

      - name: Commit refreshed stats and grades
        shell: bash
        run: |
          if git diff --quiet -- data/nfl-stats.json data/nfl-team-stats.json data/nfl-hit-timing.json data/nfl-odds.json data/model-calibration.json data/model-learning.json data/odds-history data/ladder-picks.json; then
            echo "No player/team/history changes."
            exit 0
          fi

          cp data/nfl-stats.json /tmp/nfl-stats.json
          cp data/nfl-team-stats.json /tmp/nfl-team-stats.json
          cp data/nfl-hit-timing.json /tmp/nfl-hit-timing.json
          cp data/nfl-odds.json /tmp/nfl-odds.json
          cp data/model-calibration.json /tmp/model-calibration.json
          cp data/model-learning.json /tmp/model-learning.json
          [ -f data/ladder-picks.json ] && cp data/ladder-picks.json /tmp/ladder-picks.json || true
          [ -d data/odds-history ] && cp -R data/odds-history /tmp/odds-history || true

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/nfl-stats.json data/nfl-stats.json
          cp /tmp/nfl-team-stats.json data/nfl-team-stats.json
          cp /tmp/nfl-hit-timing.json data/nfl-hit-timing.json
          cp /tmp/nfl-odds.json data/nfl-odds.json
          cp /tmp/model-calibration.json data/model-calibration.json
          cp /tmp/model-learning.json data/model-learning.json
          [ -f /tmp/ladder-picks.json ] && cp /tmp/ladder-picks.json data/ladder-picks.json || true
          if [ -d /tmp/odds-history ]; then
            rm -rf data/odds-history
            cp -R /tmp/odds-history data/odds-history
          fi

          if git diff --quiet -- data/nfl-stats.json data/nfl-team-stats.json data/nfl-hit-timing.json data/nfl-odds.json data/model-calibration.json data/model-learning.json data/odds-history data/ladder-picks.json; then
            echo "Remote already has these generated updates."
            exit 0
          fi

          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nfl-stats.json data/nfl-team-stats.json data/nfl-hit-timing.json data/nfl-odds.json data/model-calibration.json data/model-learning.json data/odds-history data/ladder-picks.json
          git commit -m "Update NFL stats, grades and adaptive model"
          git push
